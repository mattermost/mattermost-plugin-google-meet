# Disposable Mattermost, Postgres and fake Google for the plugin's e2e suite.
#   npm run server:up    # start and wait until healthy (or `make e2e-env-up` from the repo root)
#   npm run server:down  # stop and wipe all data
#
# Mattermost sends its outbound HTTPS through the fake's proxy (HTTPS_PROXY), which tunnels Google's
# real hostnames to the fake, over TLS with a throwaway CA that Go trusts through SSL_CERT_FILE (a
# bundle of the system roots plus that CA). The proxy refuses every other host, so the stack never
# reaches the internet; an unfaked Google host is also recorded as a contract violation. No plugin code changes are needed: the bundle
# under test is the normal `make dist` build. The tests reach the fake's control API on
# http://127.0.0.1:${FAKE_GOOGLE_PORT}. Adapted from mattermost-plugin-google-drive
# e2e/playwright/docker-compose.yml.
name: gmeet-plugin-e2e

# Google hosts the fake answers for: the ones the plugin's server calls (server/google.go,
# server/calendar.go), which the fake's proxy routes to it, and accounts.google.com, for a browser
# that maps it to the fake's published HTTPS port (the Cursor agent environment, .cursor/start.sh).
# The certificate covers all of them. The Playwright tests route the browser-only hosts
# (accounts.google.com, meet.google.com) themselves (lib/meet_oauth.ts).
x-fake-google-hosts: &fake-google-hosts >-
  oauth2.googleapis.com meet.googleapis.com www.googleapis.com accounts.google.com

services:
  certs:
    image: alpine:3.20.3
    command: sh -c "apk add --no-cache openssl ca-certificates >/dev/null && sh /gen-certs.sh"
    volumes:
      - certs:/certs
      - ./fake-google/gen-certs.sh:/gen-certs.sh:ro
    environment:
      FAKE_GOOGLE_HOSTS: *fake-google-hosts

  fake-google:
    image: node:24.13.1-alpine
    working_dir: /app
    command: node server.ts
    depends_on:
      certs:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${FAKE_GOOGLE_PORT:-8100}:8080"
      # HTTPS, for a browser that maps accounts.google.com to 127.0.0.1 (443 in .cursor/Dockerfile).
      - "127.0.0.1:${E2E_FAKE_HTTPS_PORT:-8463}:443"
    volumes:
      - ./fake-google:/app:ro
      - certs:/certs:ro
    environment:
      FAKE_GOOGLE_HOSTS: *fake-google-hosts
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/__control/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mostest
      POSTGRES_DB: mattermost_test
    # The tests seed plugin KV rows straight into the database (lib/kv.ts). Not 5432, which a
    # mattermost-server dev setup usually holds.
    ports:
      - "127.0.0.1:${E2E_DB_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  mattermost:
    # Must satisfy plugin.json's min_server_version. Only amd64 images are published; on Apple
    # silicon use Docker Desktop's Rosetta emulation (QEMU crashes the server at random).
    image: ${MM_IMAGE:-mattermost/mattermost-enterprise-edition:12.0.2}
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
      certs:
        condition: service_completed_successfully
      # Started first so its proxy is up from the first request.
      fake-google:
        condition: service_healthy
    # Fixed, identical host and container port: SiteURL http://localhost:<port> must reach the
    # server from the browser, and the OAuth redirect URI the plugin sends must match it. 8085 by
    # default, so the stack can run next to other plugins' e2e stacks (Drive uses 8065).
    ports:
      - "127.0.0.1:${MM_PORT:-8085}:${MM_PORT:-8085}"
    volumes:
      - certs:/certs:ro
    environment:
      MM_SERVICESETTINGS_LISTENADDRESS: :${MM_PORT:-8085}
      MM_SERVICESETTINGS_SITEURL: http://localhost:${MM_PORT:-8085}
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:mostest@postgres:5432/mattermost_test?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_ENABLETESTING: "true"
      MM_SERVICESETTINGS_ENABLEDEVELOPER: "true"
      MM_SERVICESETTINGS_ENABLEONBOARDINGFLOW: "false"
      MM_SERVICESETTINGS_ENABLESECURITYFIXALERT: "false"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
      MM_PLUGINSETTINGS_AUTOMATICPREPACKAGEDPLUGINS: "false"
      MM_LOGSETTINGS_CONSOLELEVEL: DEBUG
      MM_LOGSETTINGS_ENABLEDIAGNOSTICS: "false"
      # Keep the server off the internet: the fake's proxy refuses every non-Google host, and these
      # stop the calls it would otherwise keep retrying (notices, push proxy, marketplace).
      MM_ANNOUNCEMENTSETTINGS_ADMINNOTICESENABLED: "false"
      MM_ANNOUNCEMENTSETTINGS_USERNOTICESENABLED: "false"
      MM_EMAILSETTINGS_SENDPUSHNOTIFICATIONS: "false"
      MM_PLUGINSETTINGS_ENABLEMARKETPLACE: "false"
      MM_PLUGINSETTINGS_ENABLEREMOTEMARKETPLACE: "false"
      # Go reads this on Linux: system roots plus the fake's CA.
      SSL_CERT_FILE: /certs/ca-bundle.crt
      # All outbound HTTPS goes through the fake's proxy, which refuses Google hosts it does not fake.
      HTTPS_PROXY: http://fake-google:3128
      NO_PROXY: localhost,127.0.0.1,mattermost,postgres
      # The image has no shell or curl, so the healthcheck pings the server through mmctl over
      # the local-mode socket.
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
    healthcheck:
      test: ["CMD", "/mattermost/bin/mmctl", "--local", "system", "status"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s

volumes:
  certs: {}
