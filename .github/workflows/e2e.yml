# Playwright e2e suite against the fake Google (e2e/playwright/fake-google). Needs no Google accounts
# or secrets, so it runs on every PR, including PRs from forks. Unlike the Google Drive plugin there
# is no opt-in real-Google lane (yet): conference data cannot come from real Google without a live
# meeting. The fake is kept honest by the Discovery-document contract checked on every request, and
# by e2e-contract-drift.yml.
name: e2e

on:
  push:
    branches:
      - master
  pull_request:

permissions: {}

concurrency:
  group: e2e-${{ github.ref }}
  # Cancel superseded PR runs, but let every run on master finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Two servers: the oldest the plugin supports (min_server_version 12.0.0 in plugin.json; bump
  # this with it), and master, which catches core changes that break the plugin before they ship.
  # Only min-server gates merges: master moves daily, so a core regression there should be visible
  # without blocking unrelated plugin PRs.
  fake-google:
    name: fake-google (${{ matrix.server }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.server == 'master' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: min-server
            image: mattermost/mattermost-enterprise-edition:12.0
          - server: master
            image: mattermostdevelopment/mattermost-enterprise-edition:master
    permissions:
      contents: read
    env:
      # Read by docker-compose.yml (via make e2e-env-up).
      MM_IMAGE: ${{ matrix.image }}
    defaults:
      run:
        working-directory: e2e/playwright
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            webapp/package-lock.json
            e2e/playwright/package-lock.json

      # Runs in the background so the image pulls overlap with the plugin build.
      - name: Start the stack
        working-directory: .
        run: |
          (make e2e-env-up > "$RUNNER_TEMP/stack-up.log" 2>&1; echo $? > "$RUNNER_TEMP/stack-up.exit") &

      - name: Build the plugin bundle
        working-directory: .
        run: make dist

      # No install scripts: Playwright's browsers are installed below, and nothing else needs them.
      - name: Install e2e dependencies
        run: npm ci --ignore-scripts

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/playwright/package-lock.json') }}

      - name: Install Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # Typecheck (suite and fake), lint, test-doc lint, contract self-tests and the Node/Go
      # encryption vector.
      - name: Check
        run: npm run check

      - name: Wait for the stack to be healthy
        timeout-minutes: 10
        run: |
          while [ ! -f "$RUNNER_TEMP/stack-up.exit" ]; do sleep 5; done
          cat "$RUNNER_TEMP/stack-up.log"
          exit "$(cat "$RUNNER_TEMP/stack-up.exit")"

      - name: Run the suite against the fake Google
        run: npm test
        env:
          CI: "true"

      - name: Collect container logs
        if: always()
        run: |
          mkdir -p logs
          docker compose ps -a > logs/containers.txt
          npm run --silent server:logs > logs/containers.log

      # Uploaded on failure only, as in the Google Calendar plugin. Traces only hold the fake
      # Google's tokens and a throwaway server's data.
      - name: Upload report, traces and logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report-${{ matrix.server }}
          path: |
            e2e/playwright/results
            e2e/playwright/logs
          retention-days: 7

      - name: Stop the stack
        if: always()
        working-directory: .
        run: make e2e-env-down
